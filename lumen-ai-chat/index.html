<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Lumen · AI Chat Copilot</title>
  </head>
  <body>
    <header class="top">
      <h1>✦ Lumen</h1>
      <div><button class="ghost" id="keyBtn">🔑 API key</button></div>
    </header>
    <div class="app">
      <aside class="glass">
        <h3>Modes</h3>
        <button
          class="mode on"
          data-s="You are Lumen, a warm, concise AI copilot. Use short paragraphs and **bold** key points."
        >
          Copilot
        </button>
        <button
          class="mode"
          data-s="You summarize anything the user pastes into 3 crisp bullets plus a one-line takeaway."
        >
          Summarizer
        </button>
        <button
          class="mode"
          data-s="You explain concepts simply like to a curious 12 year old, with one analogy."
        >
          Explainer
        </button>
        <button
          class="mode"
          data-s="You brainstorm 6 creative, specific ideas as a bullet list, each with a one-line reason."
        >
          Brainstorm
        </button>
        <button class="ghost" id="clear">New chat</button>
      </aside>
      <section class="chat glass">
        <div id="log">
          <div id="hero">
            <h2>What are you curious about?</h2>
            <p>Real answers from Google Gemini. Pick a mode, then ask.</p>
            <div class="chips">
              <button class="chip">Explain how neural networks learn</button
              ><button class="chip">
                Plan a 3-day study schedule for exams</button
              ><button class="chip">
                Write a polite email asking for an extension
              </button>
            </div>
          </div>
        </div>
        <form id="f">
          <input
            id="in"
            placeholder="Message Lumen..."
            autocomplete="off"
          /><button>Send ➤</button>
        </form>
      </section>
    </div>
    <dialog id="keyDlg">
      <h3>Free Google Gemini key</h3>
      <p>
        Create a free key at
        <a
          href="https://aistudio.google.com/apikey"
          target="_blank"
          rel="noopener"
          >aistudio.google.com/apikey</a
        >. It is saved only in this browser.
      </p>
      <input
        id="keyIn"
        type="password"
        placeholder="Paste API key (AIza...)"
      /><input
        id="modelIn"
        placeholder="Model, default gemini-2.5-flash"
      /><button id="keySave">Save</button>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
